<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="460" fill="#0d0d12"/>
  <rect width="900" height="460" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e6e6e6" font-size="20" font-weight="600">E-Ink-Info-Dashboard — Wiring</text>
  <text x="24" y="54" fill="#94a3b8" font-size="12">Pi Zero 2 W driving an e-ink HAT over SPI, plus the data pull on a timer</text>

  <!-- Pi -->
  <rect x="60" y="110" width="220" height="260" rx="8" fill="#14141c" stroke="#38bdf8" stroke-width="2"/>
  <text x="170" y="136" fill="#e6e6e6" font-size="13" text-anchor="middle" font-weight="600">Pi Zero 2 W</text>
  <text x="170" y="152" fill="#94a3b8" font-size="9" text-anchor="middle">sips power, periodic redraws only</text>

  <g font-size="9" fill="#94a3b8">
    <text x="72" y="180">3V3</text>
    <text x="72" y="198">GND</text>
    <text x="72" y="216">GPIO10 (MOSI)</text>
    <text x="72" y="234">GPIO11 (SCLK)</text>
    <text x="72" y="252">GPIO8  (CS)</text>
    <text x="72" y="270">GPIO25 (DC)</text>
    <text x="72" y="288">GPIO17 (RST)</text>
    <text x="72" y="306">GPIO24 (BUSY)</text>
  </g>
  <circle cx="60" cy="176" r="3" fill="#f97316"/>
  <circle cx="60" cy="194" r="3" fill="#64748B"/>
  <circle cx="60" cy="212" r="3" fill="#38bdf8"/>
  <circle cx="60" cy="230" r="3" fill="#38bdf8"/>
  <circle cx="60" cy="248" r="3" fill="#a78bfa"/>
  <circle cx="60" cy="266" r="3" fill="#a78bfa"/>
  <circle cx="60" cy="284" r="3" fill="#a78bfa"/>
  <circle cx="60" cy="302" r="3" fill="#4ade80"/>

  <!-- e-ink HAT -->
  <rect x="420" y="110" width="240" height="260" rx="8" fill="#14141c" stroke="#38bdf8" stroke-width="2"/>
  <text x="540" y="136" fill="#e6e6e6" font-size="13" text-anchor="middle" font-weight="600">E-Ink HAT</text>
  <text x="540" y="152" fill="#94a3b8" font-size="9" text-anchor="middle">2.13" / 4.2" / 7.5" — pick a size tier</text>

  <g font-size="9" fill="#94a3b8">
    <text x="432" y="180">VCC</text>
    <text x="432" y="198">GND</text>
    <text x="432" y="216">DIN (MOSI)</text>
    <text x="432" y="234">CLK (SCLK)</text>
    <text x="432" y="252">CS</text>
    <text x="432" y="270">DC</text>
    <text x="432" y="288">RST</text>
    <text x="432" y="306">BUSY</text>
  </g>
  <circle cx="420" cy="176" r="3" fill="#f97316"/>
  <circle cx="420" cy="194" r="3" fill="#64748B"/>
  <circle cx="420" cy="212" r="3" fill="#38bdf8"/>
  <circle cx="420" cy="230" r="3" fill="#38bdf8"/>
  <circle cx="420" cy="248" r="3" fill="#a78bfa"/>
  <circle cx="420" cy="266" r="3" fill="#a78bfa"/>
  <circle cx="420" cy="284" r="3" fill="#a78bfa"/>
  <circle cx="420" cy="302" r="3" fill="#4ade80"/>

  <!-- connecting wires -->
  <line x1="60" y1="176" x2="420" y2="176" stroke="#f97316" stroke-width="2"/>
  <line x1="60" y1="194" x2="420" y2="194" stroke="#64748B" stroke-width="2"/>
  <line x1="60" y1="212" x2="420" y2="212" stroke="#38bdf8" stroke-width="2"/>
  <line x1="60" y1="230" x2="420" y2="230" stroke="#38bdf8" stroke-width="2"/>
  <line x1="60" y1="248" x2="420" y2="248" stroke="#a78bfa" stroke-width="2"/>
  <line x1="60" y1="266" x2="420" y2="266" stroke="#a78bfa" stroke-width="2"/>
  <line x1="60" y1="284" x2="420" y2="284" stroke="#a78bfa" stroke-width="2"/>
  <line x1="60" y1="302" x2="420" y2="302" stroke="#4ade80" stroke-width="2"/>

  <!-- data flow below -->
  <rect x="60" y="390" width="600" height="1" fill="none"/>
  <text x="60" y="400" fill="#e6e6e6" font-size="11" font-weight="600">Data path (not physical wiring):</text>
  <text x="60" y="420" fill="#94a3b8" font-size="10">systemd timer (not a busy-loop) → pull weather/calendar/transit API → render layout → push to HAT (full refresh</text>
  <text x="60" y="436" fill="#94a3b8" font-size="10">on a schedule, partial refresh for fast-changing regions like a clock) → panel holds the image with zero power draw.</text>

  <!-- Legend -->
  <g font-size="10" fill="#94a3b8">
    <text x="700" y="180" fill="#e6e6e6" font-weight="600">Legend</text>
    <line x1="700" y1="192" x2="724" y2="192" stroke="#f97316" stroke-width="2"/><text x="730" y="196">Power</text>
    <line x1="700" y1="208" x2="724" y2="208" stroke="#64748B" stroke-width="2"/><text x="730" y="212">Ground</text>
    <line x1="700" y1="224" x2="724" y2="224" stroke="#38bdf8" stroke-width="2"/><text x="730" y="228">SPI data/clock</text>
    <line x1="700" y1="240" x2="724" y2="240" stroke="#a78bfa" stroke-width="2"/><text x="730" y="244">Control (CS/DC/RST)</text>
    <line x1="700" y1="256" x2="724" y2="256" stroke="#4ade80" stroke-width="2"/><text x="730" y="260">BUSY status</text>
  </g>
</svg>
